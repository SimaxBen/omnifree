name: Database backups

# Nightly: dump every configured database (JSON lines for all, plus pg_dump for Neon/Supabase) into
# backups/<date>/ on Backblaze B2 and keep 14 days. Uses the same vault secrets as the hub deploy
# (OMNIFREE_ENV_VAULT_B64 + OMNIFREE_VAULT_PASSPHRASE). A failure opens an issue labelled "backup".

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 03:30 in Morocco
  workflow_dispatch:
    inputs:
      keep_days:
        description: "Days of backups to keep"
        default: "14"

permissions:
  contents: read
  issues: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt asyncpg motor pymongo
      - name: Install pg_dump 17 (matches Neon / Supabase server versions)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Restore encrypted vault
        env:
          VAULT_B64: ${{ secrets.OMNIFREE_ENV_VAULT_B64 }}
          PASS: ${{ secrets.OMNIFREE_VAULT_PASSPHRASE }}
        run: |
          echo "$VAULT_B64" | tr -d ' \r\n' | base64 -d > .env.vault
          pass="$(printf %s "$PASS" | tr -d '\r\n')"
          echo "::add-mask::$pass"
          echo "OMNIFREE_VAULT_PASSPHRASE=$pass" >> "$GITHUB_ENV"
      - id: run
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          python -m automation.backup --keep-days "${{ inputs.keep_days || '14' }}" | tee backup.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          { echo '## Backup'; echo '```'; cat backup.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Alert on failure
        if: steps.run.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create backup --color D93F0B --description "OmniFree backup alert" 2>/dev/null || true
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue create --label backup --title "Database backup failed $(date -u +%F)" \
            --body "$(printf 'Run: %s\n\n```\n%s\n```' "$run_url" "$(cat backup.log)")"
          exit 1
