name: Deploy hub

# Builds hub_api (+ Tailscale userspace layer) with Cloud Build and deploys it with
# `python -m automation.deploy deploy-hub`, the same code path as a local deploy.
#
# Repository secrets:
#   GCP_SERVICE_ACCOUNT_JSON   service account key (Cloud Run Admin, Cloud Build Editor,
#                              Artifact Registry Admin, Secret Manager Admin, Service Account User,
#                              Service Usage Admin)
#   OMNIFREE_VAULT_PASSPHRASE  passphrase of the encrypted vault
#   OMNIFREE_ENV_VAULT_B64     base64 of .env.vault (omit if the encrypted .env.vault is committed)
# Repository variables (optional): GCP_PROJECT_ID, GCP_REGION, OMNIFREE_CORS_ORIGINS

on:
  push:
    branches: [main]
    paths:
      - "hub_api/**"
      - "core/**"
      - "plugins/**"
      - "config/providers.yaml"
      - "deploy/hub/**"
      - "requirements.txt"
      - ".github/workflows/deploy-hub.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hub
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/core tests/hub_api

  deploy:
    needs: test
    # Cloud Run needs a GCP billing account; until then the hub runs on Vercel (deploy-vercel below).
    if: vars.HUB_TARGET == 'cloudrun'
    runs-on: ubuntu-latest
    environment: production
    env:
      OMNIFREE_VAULT_PASSPHRASE: ${{ secrets.OMNIFREE_VAULT_PASSPHRASE }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Restore encrypted vault
        env:
          VAULT_B64: ${{ secrets.OMNIFREE_ENV_VAULT_B64 }}
        run: |
          if [ -n "$VAULT_B64" ]; then echo "$VAULT_B64" | base64 -d > .env.vault; fi
          test -s .env.vault || { echo "::error::.env.vault missing (commit it or set OMNIFREE_ENV_VAULT_B64)"; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy
        run: |
          args=(--tag "${GITHUB_SHA::12}")
          if [ -n "${{ vars.GCP_PROJECT_ID }}" ]; then args+=(--project "${{ vars.GCP_PROJECT_ID }}"); fi
          if [ -n "${{ vars.GCP_REGION }}" ]; then args+=(--region "${{ vars.GCP_REGION }}"); fi
          IFS=',' read -ra origins <<< "${{ vars.OMNIFREE_CORS_ORIGINS }}"
          for o in "${origins[@]}"; do [ -n "$o" ] && args+=(--cors "$o"); done
          python -m automation.deploy --state "$RUNNER_TEMP/deploy_state.json" deploy-hub "${args[@]}"
      - name: Smoke test
        run: |
          url=$(python -c "import json,os;print(json.load(open(os.environ['RUNNER_TEMP']+'/deploy_state.json'))['urls']['hub'])")
          curl -fsS --retry 5 --retry-delay 5 "$url/healthz"

  deploy-vercel:
    needs: test
    # Default while there is no card: the serverless hub on Vercel (automation.deploy deploy-hub --target vercel).
    if: vars.HUB_TARGET == '' || vars.HUB_TARGET == 'vercel'
    runs-on: ubuntu-latest
    environment: production
    env:
      OMNIFREE_VAULT_PASSPHRASE: ${{ secrets.OMNIFREE_VAULT_PASSPHRASE }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt && npm install -g vercel@latest
        # (the deploy step below needs both vault secrets; without them the job ends green with a notice)
      - name: Restore encrypted vault
        id: vault
        env:
          VAULT_B64: ${{ secrets.OMNIFREE_ENV_VAULT_B64 }}
        run: |
          if [ -z "$VAULT_B64" ] || [ -z "$OMNIFREE_VAULT_PASSPHRASE" ]; then
            echo "::notice::Vercel hub not redeployed: add the OMNIFREE_ENV_VAULT_B64 and OMNIFREE_VAULT_PASSPHRASE secrets"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$VAULT_B64" | tr -d ' \r\n' | base64 -d > .env.vault
          # Secrets pasted from a file often carry a trailing newline: strip it before using the passphrase.
          pass="$(printf %s "$OMNIFREE_VAULT_PASSPHRASE" | tr -d '\r\n')"
          echo "::add-mask::$pass"
          echo "OMNIFREE_VAULT_PASSPHRASE=$pass" >> "$GITHUB_ENV"
          if ! OMNIFREE_VAULT_PASSPHRASE="$pass" python -m core.vault list > /dev/null; then
            echo "::error::the vault did not open: OMNIFREE_VAULT_PASSPHRASE must match .omnifree_vault_pass and OMNIFREE_ENV_VAULT_B64 must be the base64 of the current .env.vault"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.vault.outputs.ready == 'true'
        run: |
          origins="${{ vars.OMNIFREE_CORS_ORIGINS }}"
          origins="${origins:-https://omnifree.ilyasouhnine.tech,https://omnifree-pwa.pages.dev,https://omnifree-pwa.vercel.app,https://omnifree-pwa.netlify.app,https://simaxben.github.io,https://omnifree-edge.simaxben.workers.dev}"
          args=()
          IFS=',' read -ra list <<< "$origins"
          for o in "${list[@]}"; do [ -n "$o" ] && args+=(--cors "$o"); done
          python -m automation.deploy --state "$RUNNER_TEMP/deploy_state.json" deploy-hub --target vercel "${args[@]}"
      - name: Smoke test
        if: steps.vault.outputs.ready == 'true'
        run: curl -fsS --retry 5 --retry-delay 5 https://omnifree-hub.vercel.app/healthz
