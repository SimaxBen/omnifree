# Non-secret deployment settings for `python -m automation.deploy`. Secrets come from the vault
# (core.config Settings.secret: env var first, then .env.vault). Edit freely.
remote_dir: /opt/omnifree

ssh:
  user: ubuntu
  # Generated by `python -m automation.deploy ssh-keygen` if missing.
  private_key: ~/.ssh/omnifree_ed25519
  public_key: ~/.ssh/omnifree_ed25519.pub
  connect_timeout_s: 20

oci:
  # Always Free gives 200 GB of block storage IN TOTAL (boot volumes included):
  # 3 boot volumes x 50 GB + one 50 GB block volume = 200 GB.
  vcn_name: omnifree-vcn
  vcn_cidr: 10.42.0.0/16
  subnet_cidr: 10.42.0.0/24
  image_os: Canonical Ubuntu
  image_os_version: "24.04"
  # Ports opened in the subnet security list (everything else stays Tailscale-only).
  public_ingress:
    - {protocol: tcp, port: 22}       # ssh-bootstrap; close after Tailscale works (deploy.py lock-ssh)
    - {protocol: udp, port: 41641}    # Tailscale direct connections
    - {protocol: tcp, port: 7000}     # frps control port (AMD VM2)
    - {protocol: udp, port: 51820}    # WireGuard (AMD VM2, optional profile)
  # Retry A1 launches on "Out of host capacity" for up to this many minutes.
  capacity_retry_minutes: 30
  # Always Free A1 is 2 OCPU / 12 GB IN TOTAL (1,500 OCPU-h + 9,000 GB-h per month; the old 4 OCPU / 24 GB
  # allowance is gone). deploy_oci.py refuses A1 layouts above that.
  instances:
    oracle-arm:
      shape: VM.Standard.A1.Flex
      ocpus: 2
      memory_gb: 12
      boot_volume_gb: 50
      cloud_init: deploy/cloud-init/oracle-arm.yaml
    amd-vm1:
      shape: VM.Standard.E2.1.Micro
      boot_volume_gb: 50
      cloud_init: deploy/cloud-init/amd-vm1.yaml
    amd-vm2:
      shape: VM.Standard.E2.1.Micro
      boot_volume_gb: 50
      cloud_init: deploy/cloud-init/amd-vm2.yaml
  block_volume:
    name: omnifree-block
    size_gb: 50
    attach_to: oracle-arm
    device: /dev/oracleoci/oraclevdb
    mount_path: /mnt/omnifree-block

arm:
  compose_dir: deploy/oracle-arm        # docker-compose.yml owned by the llm_pool builder
  ollama_service: ollama
  # Directories uploaded to remote_dir for services built on the host (instinct, freellmapi injector).
  bundle: [core, plugins, instinct, config, deploy/oracle-arm, requirements.txt, requirements-optional.txt, pyproject.toml]

pihole:
  host: amd-vm1
  compose_dir: deploy/pihole

edge:
  host: amd-vm2
  compose_dir: deploy/frps
  wireguard: false                     # true -> also start the WireGuard profile

hub:
  service: omnifree-hub
  artifact_repo: omnifree
  min_instances: 0
  max_instances: 2
  memory: 512Mi
  cpu: "1"
  # Secret Manager names (3 secrets, old versions destroyed: inside the 6-active-versions free tier).
  vault_secret: omnifree-env-vault
  passphrase_secret: omnifree-vault-passphrase
  tailscale_secret: omnifree-tailscale-authkey
  chat_path: /llm/chat

pwa:
  dir: mobile_app
  dist: mobile_app/dist
  pages_project: omnifree-pwa
  # Vite env var that carries the hub/edge base URL into the build.
  hub_env_var: VITE_HUB_URL

worker:
  dir: deploy/cloudflare-worker

monitor:
  # Primary target: the Always Free GCP e2-micro (us-west1/us-central1/us-east1 only).
  gce_instance: gcp-monitor
  gce_zone: us-central1-a
  # Optional: Koyeb has no free tier for new signups since 2026; only for orgs with the legacy free instance.
  koyeb_app: omnifree-worker
