#cloud-config
# Oracle AMD micro VM2 (1/8 OCPU, 1 GB): bots / webhooks / frps / WireGuard.
hostname: amd-vm2
package_update: true
package_upgrade: true
packages: [ca-certificates, curl, jq, fail2ban, unattended-upgrades, netfilter-persistent, iptables-persistent]
swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G
write_files:
  - path: /etc/sysctl.d/90-omnifree.conf
    content: |
      net.ipv4.ip_forward=1
      net.ipv6.conf.all.forwarding=1
  - path: /etc/docker/daemon.json
    content: |
      {"log-driver": "json-file", "log-opts": {"max-size": "5m", "max-file": "2"}}
runcmd:
  - sysctl --system
  - [sh, -c, "command -v docker >/dev/null || curl -fsSL https://get.docker.com | sh"]
  - usermod -aG docker ubuntu
  - systemctl enable --now docker
  - [sh, -c, "iptables -C INPUT -i tailscale0 -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -i tailscale0 -j ACCEPT"]
  # Public ports for frps (control) and WireGuard; must match deploy.yaml oci.public_ingress.
  - [sh, -c, "iptables -C INPUT -p tcp --dport 7000 -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -p tcp --dport 7000 -j ACCEPT"]
  - [sh, -c, "iptables -C INPUT -p udp --dport 51820 -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -p udp --dport 51820 -j ACCEPT"]
  - netfilter-persistent save
  - mkdir -p /opt/omnifree && chown ubuntu:ubuntu /opt/omnifree
  - touch /var/lib/omnifree-cloud-init-done
